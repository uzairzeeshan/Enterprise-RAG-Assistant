version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: enterprise_rag_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/enterprise_rag.db
      - VECTOR_DB_DIR=./data/chroma_db
      - UPLOAD_DIR=./uploads
      - LLM_PROVIDER=mock
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: enterprise_rag_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
